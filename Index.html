<!DOCTYPE html>
<html>
<head>
  <title>Test Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: Arial;
      padding: 20px;
      background: #f5f6fa;
    }

    h2 {
      text-align: center;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      max-width: 800px;
      margin: auto;
    }
  </style>
</head>

<body>

<h2>📊 Revenue Dashboard</h2>

<div class="card">
  <canvas id="chart"></canvas>
</div>

<script>
const csvUrl = "PASTE_YOUR_WORKING_CSV_LINK_HERE";

async function fetchCSV() {
  const res = await fetch(csvUrl);
  const text = await res.text();

  const rows = text.trim().split("\n");
  const headers = rows[0].split(",");

  const data = rows.slice(1).map(row => row.split(","));

  return data;
}

async function loadChart() {
  const data = await fetchCSV();

  const labels = data.map(r => r[0]);   // Date / Name
  const values = data.map(r => Number(r[2])); // Revenue

  new Chart(document.getElementById("chart"), {
    type: "line",
    data: {
      labels: labels,
      datasets: [{
        label: "Revenue",
        data: values,
        tension: 0.3
      }]
    }
  });
}

loadChart();
</script>

</body>
</html>
